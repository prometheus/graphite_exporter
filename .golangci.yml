version: "2"
linters:
  default: none
  enable:
    - errorlint
    - modernize
    - revive
    - sloglint
    - staticcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/prometheus/graphite_exporter
  exclusions:
    generated: lax
